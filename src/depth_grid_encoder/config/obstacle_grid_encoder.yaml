obstacle_grid_encoder:
  ros__parameters:
    cloud_topic: "/depth_obstacle_filter/obstacle_cloud"
    rows: 5
    cols: 10
    # Modo angular: las columnas son sectores h=atan2(X, Z).
    # Las filas siguen siendo franjas metricas de Y (+Y apunta hacia abajo).
    # Para volver al particionado historico por franjas metricas X/Y: "metric".
    grid_mapping_mode: "angular"
    h_aperture_deg: 45.0
    h_aperture_min_deg: 15.0
    h_aperture_max_deg: 70.0
    # Apertura fisica maxima de la camara y resolucion angular interna.
    # El nodo acumula primero a esta resolucion y luego reduce a cols=10
    # segun h_aperture_deg, manteniendo /perception/depth_grid en 5x10.
    h_sensor_aperture_deg: 70.0
    h_resolution_deg: 1.0
    aperture_command_topic: "/perception/depth_grid/aperture_deg"
    aperture_state_topic: "/perception/depth_grid/aperture_state_deg"
    y_min_m: -0.20
    y_default_max_m: 2.20
    y_margin_m: 0.10
    # Guardia de seguridad en X (metros), usada por grid_mapping_mode="metric"
    x_min_m: -1.0
    x_max_m:  1.0
    # Y fijo en el nodo: [-0.20, 2.20] m (el obstacle_cloud ya viene sin suelo ni techo)
    # Filtro de profundidad Z (hacia adelante, metros) — definido en nav_bringup/config/sensor_range.yaml
    # Anti-glitch: si el filtro entrega una grilla vacía aislada, conservar por
    # pocos ms la última grilla no vacía para no apagar los motores por un frame.
    hold_last_nonempty_grid: true
    hold_timeout_ms: 250
    perf_log_enabled: true
    perf_log_period_s: 5.0
