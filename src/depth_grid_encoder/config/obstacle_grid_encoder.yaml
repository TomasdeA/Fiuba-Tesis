obstacle_grid_encoder:
  ros__parameters:
    cloud_topic: "/depth_obstacle_filter/obstacle_cloud"
    rows: 5
    cols: 10
    # Guardia de seguridad en X (metros) — descarta puntos espurios fuera del rango
    x_min_m: -1.0
    x_max_m:  1.0
    # Y fijo en el nodo: [-0.20, 2.20] m (el obstacle_cloud ya viene sin suelo ni techo)
    # Filtro de profundidad Z (hacia adelante, metros) — definido en nav_bringup/config/sensor_range.yaml
    perf_log_enabled: true
    perf_log_period_s: 5.0
