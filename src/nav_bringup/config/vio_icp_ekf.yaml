vio_icp_fusion:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: false
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: true
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: camera_link
    world_frame: odom

    odom0: vio_odom
    odom0_config: [
      true,  true,  true,
      true,  true,  true,
      true,  true,  true,
      true,  true,  true,
      false, false, false
    ]
    odom0_queue_size: 10
    odom0_nodelay: true

    odom1: icp_odom
    odom1_config: [
      true,  true,  true,
      true,  true,  true,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom1_differential: true
    odom1_queue_size: 10
    odom1_nodelay: true
