local_mapper:
  ros__parameters:
    # Topics reales de la cámara (dependen del hardware).
    # El launch file remapea estos a los nombres genéricos que usa el nodo
    # (depth/image, depth/camera_info, imu).
    depth_image_topic: "/camera/camera/depth/image_rect_raw"
    camera_info_topic: "/camera/camera/depth/camera_info"
    imu_topic:         "/camera/camera/imu"

    # Rango de profundidad válido (metros)
    range_min_m: 0.25
    range_max_m: 5.0

    # ── GroundEstimator ─────────────────────────────────────────────────
    # Tamaño de celda del voxel grid de downsampling (m)
    voxel_size_m:      0.05
    # Iteraciones máximas de RANSAC
    ransac_max_iter:   100
    # Tolerancia de inliers para RANSAC (0.0 = calcular automáticamente
    # como 3 × ruido estimado por diagnóstico de la nube)
    ground_inlier_tol: 0.0
    # Altura mínima esperada de cualquier usuario del sistema (m).
    # La cámara se monta en la cabeza, por lo que h_cam ≈ altura_persona + delta
    # de soporte. El suelo siempre está a Y >= min_person_height_m en el frame
    # alineado a gravedad. Solo se usan como candidatos a suelo los puntos con
    # Y >= este valor. El usuario midiendo mas de 1.3m solo se incluyen más
    # puntos de obstáculos, pero nunca se pierde el suelo.
    min_person_height_m: 1.3
    # Margen por encima de la cámara para clasificar como CEILING (m).
    # Puntos con Y < -ceiling_delta_m están sobre el techo/encima del usuario
    # y se descartan del mapa (no se tratan como obstáculos).
    ceiling_delta_m: 0.1

    # ── OccupancyMapper ─────────────────────────────────────────────────
    # Tamaño de celda cuadrada de la rejilla (m). Resolución lateral del mapa.
    occupancy_cell_size_m: 0.10
    # Número de celdas por lado. Con 200 celdas y 0.10 m/celda el mapa cubre
    # 20 m × 20 m centrado en el origen del marco odom.
    occupancy_grid_size: 200
    # Incremento de log-odds por observación ocupada: log(0.9/0.1) ≈ 2.197
    occupancy_l_occ:  2.197
    # Incremento de log-odds por observación libre (negativo): log(0.3/0.7) ≈ -0.847
    # |l_free| < l_occ : se necesitan ~2.6 lecturas libres para borrar un hit.
    occupancy_l_free: -0.847
    # Límites de acumulación (evitan saturación numérica).
    occupancy_l_min: -5.0
    occupancy_l_max:  5.0
    # Distancia máxima al obstáculo incluida en la actualización (m).
    occupancy_max_range_m: 5.0
    # Activa el ray casting de espacio libre (recomendado: true).
    occupancy_enable_raycasting: true
    occupancy_forget_radius_m: 10.0
