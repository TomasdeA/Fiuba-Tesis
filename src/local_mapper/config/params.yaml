local_mapper:
  ros__parameters:
    # ── OccupancyMapper ─────────────────────────────────────────────────
    # Tamaño de celda cuadrada de la rejilla (m)
    occupancy_cell_size_m: 0.10
    # Número de celdas por lado (200 celdas x 0.10 m = 20 m x 20 m)
    occupancy_grid_size: 200
    # Incremento de log-odds por observación ocupada: log(0.9/0.1) ≈ 2.197
    occupancy_l_occ:  2.197
    # Incremento de log-odds por observación libre: log(0.3/0.7) ≈ -0.847
    occupancy_l_free: -0.847
    # Límites de acumulación
    occupancy_l_min: -5.0
    occupancy_l_max:  5.0
    # Distancia máxima al obstáculo incluida en la actualización (m) — definido en nav_bringup/config/sensor_range.yaml
    # Activa el ray casting de espacio libre (recomendado: true)
    occupancy_enable_raycasting: true
    occupancy_forget_radius_m: 10.0
    # Publicar cada actualización. La cámara opera a 6 Hz y spatial_awareness
    # necesita el mapa más reciente para estimar tiempo hasta colisión.
    occupancy_publish_every_n_frames: 1
