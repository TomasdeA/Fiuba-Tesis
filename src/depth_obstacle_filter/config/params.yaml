depth_obstacle_filter:
  ros__parameters:
    # Topics reales de la cámara (dependen del hardware).
    # El launch file remapea estos a los nombres genéricos que usa el nodo
    # (depth/image, depth/camera_info, imu).
    depth_image_topic: "/camera/camera/depth/image_rect_raw"
    camera_info_topic: "/camera/camera/depth/camera_info"
    imu_topic:         "/camera/camera/accel/sample"
    # Fuente de orientación para alinear a gravedad:
    #   nav_odom    = usa /nav_odom publicado por nav_odometry (default actual)
    #   imu_legacy  = usa acelerómetro + GravityAligner legacy
    orientation_source: "nav_odom"

    # Rango de profundidad válido (metros) — definido en nav_bringup/config/sensor_range.yaml
    # Submuestreo de píxeles antes de proyectar depth a nube.
    # 1 = resolución completa; 2 = procesa 1/4 de los píxeles; 3 = 1/9.
    depth_pixel_stride: 2
    debug: false
    publish_local_mapper_interface: false
    # Altura de cámara usada por obstacle_grid_encoder para fijar y_max.
    # La cámara va montada a altura casi fija: filtrar fuerte evita que el
    # heatmap cambie por jitter del estimador de suelo.
    height_filter_alpha: 0.03
    height_max_step_m: 0.005
    height_outlier_reject_m: 0.25
    height_publish_delta_m: 0.05
    # Aceptar una altura nueva sólo si el plano de piso es confiable.
    # Si falla alguna condición, se conserva la altura anterior.
    height_min_ground_quality: 0.35
    height_min_ground_inliers: 50
    height_max_ground_tilt_deg: 8.0

    # ── GroundEstimator ─────────────────────────────────────────────────
    # Habilitar voxel grid antes de RANSAC. Desactivar para medir costo/beneficio
    # cuando RANSAC ya trabaja sobre la banda cercana al Y máximo.
    enable_voxel_filter: false
    # Tamaño de celda del voxel grid de downsampling (m)
    voxel_size_m:      0.1
    # Iteraciones máximas de RANSAC
    ransac_max_iter:   100
    # Máximo de puntos de la banda de suelo usados para contar inliers en RANSAC.
    # 0 o negativo deshabilita el límite.
    ransac_max_band_points: 5000
    # Tolerancia de inliers para RANSAC (0.0 = calcular automáticamente
    # como 3 × ruido estimado por diagnóstico de la nube)
    ground_inlier_tol: 0.0
    # Altura mínima esperada de cualquier usuario del sistema (m).
    min_person_height_m: 1.3
    # Margen por encima de la cámara para clasificar como CEILING (m).
    ceiling_delta_m: 0.1

    # ── Performance ─────────────────────────────────────────────────
    perf_log_enabled: true
    perf_log_period_s: 5.0
