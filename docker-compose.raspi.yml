services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
        USERNAME: tomasdea
    image: tesis-ros2:humble-cpu-arm64
    container_name: tesis_nav_dev
    platform: linux/arm64
    network_mode: host
    ipc: host
    privileged: true
    pid: host
    group_add:
      - "dialout"
      - "video"
      - "plugdev"
      - "gpio"   # grupo del chip GPIO en Raspberry Pi OS

    environment:
      - ROS_DISTRO=humble
      - RUNNING_IN_CONTAINER=1
      - BASH_ENV=/etc/profile.d/context.sh
      - WS_PATH=${CONTAINER_WS}
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp

    volumes:
      - /dev:/dev
      - /dev/bus/usb:/dev/bus/usb
      - /sys:/sys:ro
      - /run/udev:/run/udev:ro
      - /dev/gpiochip0:/dev/gpiochip0   # GPIO chip para gpio_rosbag_controller
      - ${HOST_WS}:${CONTAINER_WS}
      - ./docker/context.sh:/etc/profile.d/context.sh:ro

    working_dir: ${CONTAINER_WS}
    tty: true
